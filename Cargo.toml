# Bonsai — one recursive atom/parent engine for code structure AND documentation (ADR 0134).
# Standalone workspace (own `[workspace]`) so it is isolated from the meta-repo root
# workspace and extraction-ready (Bonsai graduates to its own repo).
[package]
name = "bonsai"
version = "0.1.0"
edition = "2021"
description = "A recursive atom/parent structure engine: parallel dedup, dead-code, reference-safe moves, and a fail-closed leanness gate for any repo — laptop to monorepo."
license = "AGPL-3.0-or-later"
repository = "https://github.com/QuiteTall/bonsai"
keywords = ["refactoring", "duplication", "dead-code", "sarif", "monorepo"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "bonsai"
path = "src/main.rs"

[lib]
name = "bonsai"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
protobuf = "3"
rayon = "1"
scip = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"

# Isolate from any parent cargo workspace.
[workspace]
